name: Tests
permissions:
  contents: read
on:
  schedule:
    - cron: "0 0 1 */4 *"
  push:
    branches: 
      - "release/**"
  pull_request:
    branches: 
      - "master"
      - "dev"
env:
  CARGO_TERM_COLOR: always
  STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
  PROJECT_PATH: ${{ github.workspace }}
  RUST_BACKTRACE: 1
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Create env file
      run: bash ./scripts/actions/create_env_file.sh
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ./target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Configure project
      run: |
        # Set properties
        cargo run --profile ci -p gss-cli -- config properties -f --locked
        # Set test mode
        cargo run --profile ci -p gss-cli -- config properties --test_mode 1 --locked
        # Set store fronts
        cargo run --profile ci -p gss-cli -- config settings -a --locked
      shell: bash
    - name: Cache Steam games
      run: cargo run --profile ci -p gss-cli -- --update-cache --locked
    - name: Run tests
      run: cargo test --profile ci -- --test-threads=1 --show-output --locked
  windows:
    needs: linux
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure toolchain
        run: |
          # Install toolchain
          #rustup toolchain install stable-x86_64-pc-windows-gnu
          # Set default toolchain
          #rustup default stable-x86_64-pc-windows-gnu
          # List toolchains
          echo "List Toolchains:"
          rustup toolchain list
        shell: pwsh
      - name: Create env file
        run: .\scripts\actions\create_env_file.ps1
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Configure project
        run: |
          # Set properties
          cargo run --profile ci -p gss-cli -- config properties -f --locked
          # Set test mode
          cargo run --profile ci -p gss-cli -- config properties --test_mode 1 --locked
          # Set store fronts
          cargo run --profile ci -p gss-cli -- config settings -a --locked 
        shell: pwsh
      - name: Cache Steam games
        run: cargo run --profile ci -p gss-cli -- --update-cache --locked
      - name: Run tests
        run: cargo test --profile ci -- --test-threads=1 --show-output --locked