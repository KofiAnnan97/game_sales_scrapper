[workspace]
resolver = "3"
members = [
    "crates/common/constants",
    "crates/common/structs",
    "crates/common/file_types",
    "crates/common/properties",
    "crates/common/file_ops",
    "crates/common/stores",
    "crates/common/alerting", 
    "crates/gss-cli",
]

[workspace.package]
version = "0.2.0"
authors = ["Elinam Gbordzoe <elinamgbordzoe@gmail.com>"]
edition = "2024"

[workspace.dependencies]
reqwest = { version = "0.12.15", features = ["json", "blocking", "cookies"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive", "cargo"] }
dotenv = "0.15.0"
dotenvy = "0.15.7"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
regex = "1.11.1"
exitcode = "1.1.2"
lettre = "0.11.15"
csv = "1.3.1"
aes-gcm = "0.10.3"
rand = "0.9.2"
base64 = "0.22.1"
hex = "0.4.3"
chrono = "0.4.42"
iced = "0.14.0"