[workspace]
resolver = "3"
members = [
    "crates/gss-core/constants",
    "crates/gss-core/structs",
    "crates/gss-core/file_types",
    "crates/gss-core/properties",
    "crates/gss-core/file_ops",
    "crates/gss-core/stores",
    "crates/gss-core/alerting", 
    "crates/gss-core/errors", 
    "crates/gss-app",
    "crates/gss-cli", 
    "crates/gss-tests"
]

[workspace.package]
version = "0.3.0"
authors = ["Elinam Gbordzoe <elinamgbordzoe@gmail.com>"]
edition = "2024"

[workspace.dependencies]
reqwest = { version = "0.12.15", features = ["json", "blocking", "cookies"] }
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive", "cargo"] }
dotenv = "0.15.0"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12.4"
exitcode = "1.1.2"
lettre = "0.11.22"
csv = "1.4.0"
aes-gcm = "0.10.3"
rand = "0.9.2"
base64 = "0.22.1"
hex = "0.4.3"
chrono = "0.4.45"
iced = { version = "0.14.0", features = ["image"] }
iced_aw = { version = "0.14.0", features = ["full"] }
mockall = "0.14.0"
mockito = "1.7.2"
async-trait = "0.1.89"
rfd = "0.17.2"