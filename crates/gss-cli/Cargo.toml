[package]
name = "gss-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
# Internal crates
alerting = { path = "../gss-core/alerting" }
file_ops = { path = "../gss-core/file_ops" }
files = { path = "../gss-core/files" }
stores = { path = "../gss-core/stores" }
types = { path = "../gss-core/types" }
properties = { path = "../gss-core/properties" }
constants = { path = "../gss-core/constants" }

# External crates
reqwest = { workspace = true, features = ["json", "blocking"] }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "cargo"] }
serde_json.workspace = true
futures.workspace = true
